name: Gemini Auto Code Updater

on:
  issues:
    types: [opened]

jobs:
  update-code:
    if: startsWith(github.event.issue.title, 'Gemini:')
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 🚀 Evita conflictos descargando todo el historial

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar la nueva librería oficial de Google
      run: pip install google-genai

    - name: Ejecutar Inteligencia Artificial
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: python gemini_update.py

    - name: Guardar todos los cambios en el repositorio
      run: |
        git config --global user.name "GeminiBot"
        git config --global user.email "gemini-bot@github.com"
        git add .
        
        # 🚀 Si Gemini no modificó nada, el flujo no falla, avisa y termina limpio
        if git diff --staged --quiet; then
          echo "ℹ️ Gemini determinó que no hacían falta cambios en los archivos."
        else
          git commit -m "🤖 Proyecto actualizado automáticamente por Gemini (Issue #${{ github.event.issue.number }})"
          BRANCH_NAME=$(git branch --show-current)
          # 🚀 Forzamos la subida para evitar que GitHub lo rechace por desincronización
          git push origin $BRANCH_NAME --force
        fi
