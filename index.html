<!DOCTYPE html>
<html lang="es">
<head>

    <title>InmoCRM - Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crm-layout">
        <aside class="sidebar">
            <div class="logo">InmoCRM</div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Propiedades</a>
                <a href="#" class="nav-item">Leads</a>
                <a href="#" class="nav-item">Configuración</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <input type="text" placeholder="Buscar propiedades o clientes..." class="search-bar">

            <div class="content-area" id="app-content">

                <p>Aquí inyectaremos las tarjetas del inventario o el tablero de clientes.</p>
