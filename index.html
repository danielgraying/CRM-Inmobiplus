<!-- MODAL 1: PROPIEDAD (CREAR / EDITAR) -->
    <div class="modal-backdrop" id="property-modal">
        <div class="modal-window" style="max-width: 560px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 id="property-modal-title">Agregar Nueva Propiedad</h3>
                <button class="modal-close" id="close-modal-btn">✕</button>
            </div>
            <form id="property-form">
                <input type="hidden" id="prop-edit-id">

                <div class="form-group">
                    <label>Título / Dirección Corta</label>
                    <input type="text" id="prop-address" placeholder="Ej. Residencias Vista Alta, Apto 4B" required>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label>País</label>
                        <select id="prop-country" required>
                            <option value="Venezuela">Venezuela</option>
                            <option value="Colombia">Colombia</option>
                            <option value="México">México</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Chile">Chile</option>
                            <option value="Perú">Perú</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="prop-subdiv-label">Estado</label>
                        <select id="prop-subdivision" required></select>
                    </div>
                    <div class="form-group">
                        <label id="prop-city-label">Ciudad / Municipio</label>
                        <select id="prop-city" required></select>
                    </div>
                </div>

                <!-- COORDENADAS GPS EXACTAS -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Latitud GPS (Pin)</label>
                        <input type="number" id="prop-lat" step="any" placeholder="Ej. 7.7885" required>
                    </div>
                    <div class="form-group">
                        <label>Longitud GPS (Pin)</label>
                        <input type="number" id="prop-lng" step="any" placeholder="Ej. -72.2156" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Inmueble</label>
                        <select id="prop-category" required>
                            <option value="Apartamento">Apartamento</option>
                            <option value="Casa">Casa</option>
                            <option value="Townhouse">Townhouse</option>
                            <option value="Local">Local / Oficina</option>
                            <option value="Terreno">Terreno / Lote</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Operación</label>
                        <select id="prop-type" required>
                            <option value="Venta">Venta</option>
                            <option value="Alquiler">Alquiler</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Precio ($)</label>
                        <input type="number" id="prop-price" placeholder="Ej. 95000" min="0" step="any" required>
                    </div>
                    <div class="form-group">
                        <label>URL de Imagen Principal (Opcional)</label>
                        <input type="url" id="prop-image" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label>Habitaciones</label>
                        <input type="number" id="prop-beds" min="0" max="20" placeholder="3" required>
                    </div>
                    <div class="form-group">
                        <label>Baños</label>
                        <input type="number" id="prop-baths" min="0" max="20" step="0.5" placeholder="2" required>
                    </div>
                    <div class="form-group">
                        <label>Estacionamientos</label>
                        <input type="number" id="prop-parking" min="0" max="10" placeholder="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Área Construida (m²)</label>
                        <input type="number" id="prop-sqm-build" min="0" placeholder="120" required>
                    </div>
                    <div class="form-group">
                        <label>Terreno / Lote Total (m²)</label>
                        <input type="number" id="prop-sqm-lot" min="0" placeholder="180" required>
                    </div>
                </div>

                <div class="form-group">
                    <label style="margin-bottom: 4px;">Amenities / Extras</label>
                    <div class="checkbox-row" style="display: flex; gap: 14px; flex-wrap: wrap;">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="prop-pool">
                            <span>Piscina</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" id="prop-pets">
                            <span>Mascotas permitidas</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" id="prop-furnished">
                            <span>Amoblado</span>
                        </label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancel-modal-btn">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btn-save-prop">Guardar Inmueble</button>
                </div>
            </form>
        </div>
    </div>
